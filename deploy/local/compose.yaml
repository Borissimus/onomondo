name: sgp32-local

x-app: &app
  image: sgp32-prototype-local:dev
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-environment: &backend-environment
  DATABASE_URL_FILE: /run/secrets/database_url
  OPERATOR_USERNAME: admin
  OPERATOR_PASSWORD_HASH_FILE: /run/secrets/operator_argon2id
  ONOMONDO_API_KEY_FILE: /run/secrets/mock_api_key
  ONOMONDO_API_URL: https://mock-onomondo:8443/api
  ONOMONDO_CA_FILE: /run/secrets/ca_crt
  # Confirmation applies ONLY to the local mock contract, not the hosted beta API.
  ONOMONDO_SCHEMA_CONFIRMED: 'true'
  MQTT_HOST: mosquitto
  MQTT_PORT: '8883'
  MQTT_CA: /run/secrets/ca_crt
  MQTT_USERNAME: backend
  MQTT_PASSWORD_FILE: /run/secrets/backend_mqtt_password

x-backend-secrets: &backend-secrets
  - database_url
  - operator_argon2id
  - mock_api_key
  - ca_crt
  - backend_mqtt_password

services:
  gateway:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:8443:8443', '127.0.0.1:8883:8883', '127.0.0.1:15432:15432']
    networks: [default, edge]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sgp32
      POSTGRES_USER: sgp32
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgp32 -d sgp32']
      interval: 2s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
    secrets: [ca_crt, mqtt_crt, mqtt_key, mqtt_passwords]
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8883']
      interval: 2s
      timeout: 3s
      retries: 30

  mock-onomondo:
    <<: *app
    command:
      - uvicorn
      - mock_onomondo:app
      - --app-dir
      - /app/local
      - --host
      - 0.0.0.0
      - --port
      - '8443'
      - --ssl-certfile
      - /run/secrets/mock_crt
      - --ssl-keyfile
      - /run/secrets/mock_key
      - --no-access-log
    environment:
      MOCK_KEY_FILE: /run/secrets/mock_api_key
      MOCK_DATABASE: /var/lib/sgp32/mock.db
    volumes:
      - ./mock_onomondo.py:/app/local/mock_onomondo.py:ro
      - mock-data:/var/lib/sgp32
    secrets: [mock_api_key, ca_crt, mock_crt, mock_key]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8443/health', context=ssl.create_default_context(cafile='/run/secrets/ca_crt'), timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    restart: 'no'
    command: ['python', '-m', 'sgp32.migrate']
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    command: ['sgp32-worker']
    environment: *backend-environment
    secrets: *backend-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      mock-onomondo:
        condition: service_healthy

  api:
    <<: *app
    command:
      - uvicorn
      - sgp32.application:application
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - '8443'
      - --ssl-certfile
      - /run/secrets/api_crt
      - --ssl-keyfile
      - /run/secrets/api_key
      - --no-access-log
    environment: *backend-environment
    secrets:
      - database_url
      - operator_argon2id
      - mock_api_key
      - ca_crt
      - backend_mqtt_password
      - api_crt
      - api_key
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8443/api/v1/health/ready', context=ssl.create_default_context(cafile='/run/secrets/ca_crt'), timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30

  agent-sim:
    <<: *app
    command: ['sgp32-agent']
    environment:
      AGENT_DEVICE_ID: device-a
      AGENT_SIMULATE: 'true'
      AGENT_COMMAND_DB: /var/lib/sgp32/commands.db
      AGENT_TELEMETRY_INTERVAL: '30'
      MQTT_HOST: mosquitto
      MQTT_PORT: '8883'
      MQTT_CA: /run/secrets/ca_crt
      MQTT_USERNAME: device-a
      MQTT_PASSWORD_FILE: /run/secrets/device_a_password
    volumes: [agent-data:/var/lib/sgp32]
    secrets: [ca_crt, device_a_password]
    depends_on:
      mosquitto:
        condition: service_healthy
      api:
        condition: service_healthy

# Runtime traffic stays on this network; no route to the real Onomondo platform.
networks:
  default:
    internal: true
  edge: {}

volumes:
  postgres-data:
  mosquitto-data:
  mock-data:
  agent-data:

secrets:
  postgres_password:
    file: ../../.local/sgp32/postgres_password
  database_url:
    file: ../../.local/sgp32/database_url
  operator_argon2id:
    file: ../../.local/sgp32/operator_argon2id
  mock_api_key:
    file: ../../.local/sgp32/mock_api_key
  backend_mqtt_password:
    file: ../../.local/sgp32/backend_mqtt_password
  device_a_password:
    file: ../../.local/sgp32/device_a_password
  mqtt_passwords:
    file: ../../.local/sgp32/mqtt_passwords
  ca_crt:
    file: ../../.local/sgp32/ca.crt
  api_crt:
    file: ../../.local/sgp32/api.crt
  api_key:
    file: ../../.local/sgp32/api.key
  mqtt_crt:
    file: ../../.local/sgp32/mqtt.crt
  mqtt_key:
    file: ../../.local/sgp32/mqtt.key
  mock_crt:
    file: ../../.local/sgp32/mock.crt
  mock_key:
    file: ../../.local/sgp32/mock.key

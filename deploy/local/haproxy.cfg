global
    maxconn 256

defaults
    mode tcp
    timeout connect 5s
    timeout client 90s
    timeout server 90s

# Docker can assign a new address when an application container is recreated.
# Resolve service names through Docker's embedded DNS instead of retaining the
# address that happened to exist when HAProxy first started.
resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend api
    bind :8443
    default_backend api_service
backend api_service
    server api api:8443 check resolvers docker init-addr last,libc,none

frontend mqtt
    bind :8883
    default_backend mqtt_service
backend mqtt_service
    server broker mosquitto:8883 check resolvers docker init-addr last,libc,none

frontend postgres
    bind :15432
    default_backend postgres_service
backend postgres_service
    server db postgres:5432 check resolvers docker init-addr last,libc,none

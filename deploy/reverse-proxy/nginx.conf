# Install inside nginx's http context. Replace example domains and certificate paths.
limit_req_zone $binary_remote_addr zone=operator:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name api.example.invalid;
    ssl_certificate /etc/letsencrypt/live/api.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    access_log off;
    location = /api/v1/metrics { deny all; }
    location / {
        limit_req zone=operator burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }
}
